<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#081116" />
    <meta name="description" content="AChat — защищённый семейный мессенджер" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("achat-ui") || "{}");
          var mode = stored && stored.state && stored.state.theme || "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#081116" : "#f6f8f9");
        } catch (_) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script>
      (function () {
        var redirect = sessionStorage.getItem("achat_redirect");
        if (redirect) {
          sessionStorage.removeItem("achat_redirect");
          window.history.replaceState(null, "", redirect);
        }
      })();
    </script>
    <title>AChat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
